name: Build CLI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - run: go test ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: skopeo-cli-linux-x64
          - goos: linux
            goarch: arm64
            name: skopeo-cli-linux-arm64
          - goos: windows
            goarch: amd64
            name: skopeo-cli-win-x64.exe
          - goos: windows
            goarch: arm64
            name: skopeo-cli-win-arm64.exe
          - goos: darwin
            goarch: amd64
            name: skopeo-cli-mac-x64
          - goos: darwin
            goarch: arm64
            name: skopeo-cli-mac-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        run: go build -trimpath -ldflags "-s -w" -o ${{ matrix.name }} .
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: skopeo-cli-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: .github/RELEASE_NOTES.md
          files: artifacts/*
          draft: false
          prerelease: false
