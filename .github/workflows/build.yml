name: Build CLI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - run: go test ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build Linux
        run: go build -trimpath -ldflags "-s -w" -o skopeo-linux .
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0

      - name: Build Windows
        run: go build -trimpath -ldflags "-s -w" -o skopeo-cli.exe .
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0

      - name: Build macOS
        run: go build -trimpath -ldflags "-s -w" -o skopeo-macos .
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: 0

      - uses: actions/upload-artifact@v4
        with:
          name: skopeo-binaries
          path: |
            skopeo-linux
            skopeo-cli.exe
            skopeo-macos

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: skopeo-binaries
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: .github/RELEASE_NOTES.md
          files: |
            artifacts/skopeo-linux
            artifacts/skopeo-cli.exe
            artifacts/skopeo-macos
          draft: false
          prerelease: false
